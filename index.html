<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA PV-2026 | Enterprise Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex items-center justify-center p-4">
    
    <div id="toastContainer" class="fixed top-5 right-5 z-[100] flex flex-col gap-3"></div>

    <div id="telaLogin" class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center">
        <div class="mb-6 inline-flex p-4 rounded-full bg-slate-100 text-slate-800">
            <i data-lucide="shield-check" class="w-10 h-10"></i>
        </div>
        <h1 class="text-2xl font-black mb-2 uppercase tracking-tighter">PV-2026 Login</h1>
        <p class="text-slate-500 text-sm mb-8">Acesse o painel administrativo</p>

        <form id="loginForm" class="space-y-4">
            <input type="text" id="loginUser" placeholder="Usuário" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 ring-slate-800" required>
            <input type="password" id="loginPass" placeholder="Senha" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 ring-slate-800" required>
            <button type="submit" class="w-full py-4 rounded-2xl bg-slate-900 text-white font-bold uppercase tracking-widest hover:bg-black transition-colors">Entrar</button>
        </form>
    </div>

    <div id="app" class="hidden w-full max-w-4xl bg-white p-8 rounded-[2.5rem] shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-black uppercase tracking-tighter">Painel de Controle</h2>
                <p id="userStatus" class="text-xs font-bold text-slate-400"></p>
            </div>
            <button onclick="logout()" class="p-3 rounded-xl bg-red-50 text-red-600 hover:bg-red-100"><i data-lucide="log-out"></i></button>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="space-y-4">
                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Novo Registro</h3>
                <form id="registerForm" class="space-y-3">
                    <input type="text" id="regUser" placeholder="Nome de Usuário" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-100 outline-none focus:ring-1 ring-slate-400">
                    <input type="password" id="regPass" placeholder="Definir Senha" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-100 outline-none focus:ring-1 ring-slate-400">
                    <select id="regRole" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-100 outline-none">
                        <option value="user">Usuário Comum</option>
                        <option value="admin">Administrador</option>
                    </select>
                    <button type="submit" class="w-full py-3 rounded-xl bg-slate-800 text-white font-bold text-xs uppercase">Cadastrar</button>
                </form>
            </div>

            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Usuários do Sistema</h3>
                    <button onclick="gerarPDF()" class="text-[10px] bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold hover:bg-green-200 transition-colors">GERAR PDF</button>
                </div>
                <div class="overflow-hidden rounded-2xl border border-slate-100">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-3 text-[10px] font-black uppercase text-slate-400">Usuário</th>
                                <th class="p-3 text-[10px] font-black uppercase text-slate-400">Nível</th>
                                <th class="p-3 text-[10px] font-black uppercase text-slate-400">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="userList" class="text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
