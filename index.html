<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA PV-2026 | Enterprise Control</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-900 min-h-screen">

    <div id="toastContainer" class="fixed top-5 right-5 z-[100] flex flex-col gap-3"></div>

    <div id="customModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] shadow-2xl p-8 animate-in zoom-in duration-200">
            <div class="text-center">
                <div id="modalIcon" class="inline-flex p-4 rounded-2xl mb-4 bg-red-50 text-red-600">
                    <i data-lucide="alert-triangle" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-black text-slate-800 mb-2 uppercase tracking-tighter">Protocolo de Segurança</h3>
                <p id="modalText" class="text-slate-500 text-sm font-medium mb-8 leading-relaxed"></p>
                
                <div class="flex gap-3">
                    <button onclick="fecharModal()" class="flex-1 py-4 rounded-2xl bg-slate-100 text-slate-600 font-black text-[10px] hover:bg-slate-200 transition uppercase">Cancelar</button>
                    <button id="modalConfirmBtn" class="flex-1 py-4 rounded-2xl bg-red-600 text-white font-black text-[10px] hover:bg-red-700 transition shadow-lg shadow-red-200 uppercase">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="telaLogin" class="fixed inset-0 z-50 flex items-center justify-center bg-corporativo p-4">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] shadow-2xl p-10 text-center">
            <div class="inline-flex p-4 bg-blue-600 rounded-2xl mb-6 shadow-xl shadow-blue-500/40">
                <i data-lucide="shield-check" class="text-white w-10 h-10"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 mb-2 tracking-tighter uppercase">Portaria Viva 2026</h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mb-8">Acesso ao Terminal</p>
            <div class="space-y-4">
                <input type="text" id="userLogin" placeholder="Credencial" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-600 font-bold uppercase">
                <input type="password" id="passLogin" placeholder="Senha Master" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-600 font-bold uppercase">
                <button onclick="autenticar()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl hover:bg-blue-600 transition shadow-xl">LOG-IN</button>
            </div>
        </div>
    </div>

    <div id="app" class="hidden max-w-6xl mx-auto p-4 md:p-8">
        
        <header class="flex flex-col md:flex-row justify-between items-center gap-6 mb-10">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-3 rounded-xl shadow-lg"><i data-lucide="command" class="text-white w-6 h-6"></i></div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tighter">PORTARIA <span class="text-blue-600">VIVA</span></h1>
                    <p id="dataAtual" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"></p>
                </div>
            </div>
            <nav class="flex bg-white p-1.5 rounded-[1.5rem] shadow-sm border border-slate-200 gap-1">
                <button onclick="mostrar('cadastro')" id="nav-cadastro" class="px-6 py-3 rounded-xl text-[11px] font-black transition">CADASTRO</button>
                <button onclick="mostrar('registro')" id="nav-registro" class="px-6 py-3 rounded-xl text-[11px] font-black transition">REGISTRO</button>
                <button onclick="mostrar('lista')" id="nav-lista" class="px-6 py-3 rounded-xl text-[11px] font-black transition">HISTÓRICO</button>
                <button onclick="logout()" class="p-3 text-red-500 hover:bg-red-50 rounded-xl transition"><i data-lucide="log-out" class="w-5 h-5"></i></button>
            </nav>
        </header>

        <div id="statsRow" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 hidden">
            <div class="stat-card bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-5">
                <div class="p-4 bg-blue-50 text-blue-600 rounded-2xl"><i data-lucide="users"></i></div>
                <div><p class="text-xs font-bold text-slate-400 uppercase">Alunos</p><h3 id="stat-alunos" class="text-2xl font-black">0</h3></div>
            </div>
            <div class="stat-card bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-5">
                <div class="p-4 bg-orange-50 text-orange-600 rounded-2xl"><i data-lucide="clock-4"></i></div>
                <div><p class="text-xs font-bold text-slate-400 uppercase">Hoje</p><h3 id="stat-hoje" class="text-2xl font-black">0</h3></div>
            </div>
            <div class="stat-card bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center gap-5">
                <div class="p-4 bg-green-50 text-green-600 rounded-2xl"><i data-lucide="trending-up"></i></div>
                <div><p class="text-xs font-bold text-slate-400 uppercase">Média</p><h3 id="stat-media" class="text-2xl font-black">0m</h3></div>
            </div>
        </div>

        <main>
            <section id="cadastro" class="hidden animate-in fade-in zoom-in duration-300">
                <div class="max-w-xl mx-auto bg-white p-10 rounded-[3rem] shadow-2xl border border-slate-100">
                    <h2 class="text-xl font-bold text-slate-800 mb-8 flex items-center gap-2">
                        <i data-lucide="user-plus" class="text-blue-600"></i> Novo Estudante
                    </h2>
                    <div class="space-y-6">
                        <input type="text" id="nome" placeholder="NOME DO ALUNO" class="w-full p-4 border rounded-2xl font-bold bg-slate-50 uppercase outline-none focus:ring-2 focus:ring-blue-600">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="turma" placeholder="TURMA" class="w-full p-4 border rounded-2xl font-bold bg-slate-50 uppercase outline-none focus:ring-2 focus:ring-blue-600">
                            <select id="turno" class="w-full p-4 border rounded-2xl font-bold bg-slate-50 outline-none">
                                <option value="Manhã">MANHÃ (07:05)</option>
                                <option value="Tarde">TARDE (13:10)</option>
                            </select>
                        </div>
                        <button onclick="salvarAluno()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black shadow-lg hover:bg-blue-700 transition uppercase tracking-widest">Salvar no Banco</button>
                    </div>
                    <div class="mt-12 pt-8 border-t border-slate-100">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Matrículas Ativas</h3>
                            <button onclick="copiarBackup()" class="text-[9px] font-black bg-slate-100 px-3 py-1 rounded-full text-slate-500 hover:bg-slate-200 transition">BACKUP TXT</button>
                        </div>
                        <div id="listaAlunosBD" class="space-y-2 max-h-48 overflow-y-auto pr-2 custom-scroll"></div>
                    </div>
                </div>
            </section>

            <section id="registro" class="hidden animate-in slide-in-from-bottom-4 duration-300">
                <div class="max-w-xl mx-auto bg-white p-10 rounded-[3rem] shadow-2xl border border-slate-100">
                    <h2 class="text-xl font-bold mb-8 text-slate-800 text-center">Protocolo de Entrada</h2>
                    <div class="space-y-5">
                        <div class="bg-slate-900 p-8 rounded-[2rem] text-white">
                            <label class="text-[10px] font-black uppercase mb-3 block text-blue-400 tracking-widest">Busca de Discente</label>
                            <input type="text" id="inputBuscaAluno" onkeyup="filtrarAlunosNoRegistro()" placeholder="Digite o nome..." class="w-full p-4 bg-white/10 rounded-2xl outline-none font-bold text-white mb-4">
                            <select id="alunoSelect" class="w-full p-4 rounded-xl font-bold text-slate-900 bg-white border-none"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="date" id="data" class="p-4 border rounded-2xl bg-slate-50 font-bold outline-none">
                            <input type="time" id="hora" class="p-4 border rounded-2xl font-black text-blue-600 bg-slate-50 text-center text-2xl outline-none">
                        </div>
                        <select id="motivo" onchange="toggleMotivo()" class="w-full p-4 border rounded-2xl bg-slate-50 font-bold outline-none">
                            <option value="Atraso: Transporte Escolar">🚌 TRANSPORTE ESCOLAR</option>
                            <option value="Atraso: Consulta Médica">🏥 CONSULTA MÉDICA</option>
                            <option value="Atraso: Problemas Pessoais">⚠️ PROBLEMAS PESSOAIS</option>
                            <option value="Outros">❓ OUTROS (ESPECIFICAR)</option>
                        </select>
                        <input type="text" id="motivoCustom" placeholder="Descreva o motivo..." class="w-full p-4 border-2 border-blue-200 rounded-2xl hidden font-bold italic">
                        <button onclick="salvarAtraso()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-xl hover:bg-blue-600 transition uppercase tracking-widest">Efetuar Registro</button>
                    </div>
                </div>
            </section>

            <section id="lista" class="hidden animate-in fade-in duration-300">
                <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden">
                    <div class="p-8 border-b flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-50/50">
                        <h2 class="text-xl font-black text-slate-800 tracking-tighter uppercase">Relatórios de Entrada</h2>
                        <button onclick="exportarPDFGeral()" class="bg-blue-600 text-white px-6 py-4 rounded-2xl text-[11px] font-black flex items-center gap-2 shadow-lg"><i data-lucide="file-down" class="w-4 h-4"></i> PDF GERAL</button>
                    </div>
                    <div id="conteudoLista" class="overflow-x-auto min-h-[400px]"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
          </html>
