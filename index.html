<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV-2026 PRO | Controle Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; background: #020617; }
        .nav-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: #64748b; }
        .nav-btn.active { background: #ffffff; color: #020617; box-shadow: 0 10px 15px -3px rgba(255, 255, 255, 0.1); }
        .animate-3d-entry { animation: entry 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes entry { from { opacity: 0; transform: translateY(20px) scale(0.98); filter: blur(5px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        .toast-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 16px 24px; border-radius: 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); animation: toast-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; min-width: 280px; }
        @keyframes toast-in { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-success { border-left: 4px solid #10b981; }
        .toast-error { border-left: 4px solid #ef4444; }
        .toast-info { border-left: 4px solid #6366f1; }
        .radio-ent { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 18px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; font-weight: 700; text-transform: uppercase; font-size: 10px; transition: 0.2s; }
        .radio-ent:hover { background: rgba(255, 255, 255, 0.08); border-color: #4f46e5; }
        .radio-ent input { width: 18px; height: 18px; accent-color: #4f46e5; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen font-sans">

    <div id="toastContainer" class="fixed top-6 right-6 z-[100] flex flex-col gap-3"></div>

    <div id="customModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[110] hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-white/10 p-8 rounded-[2.5rem] max-w-sm w-full shadow-2xl animate-3d-entry">
            <h3 id="modalTitle" class="text-xl font-black uppercase italic text-white mb-2">Confirmar?</h3>
            <p id="modalText" class="text-slate-400 text-sm mb-8 font-bold"></p>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-4 rounded-2xl bg-white/5 text-slate-400 font-black uppercase text-[10px] hover:bg-white/10">Cancelar</button>
                <button id="modalConfirmBtn" class="flex-1 py-4 rounded-2xl bg-red-600 text-white font-black uppercase text-[10px] hover:bg-red-500 shadow-lg shadow-red-600/20">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Seção de Login -->
    <div id="authSection" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white/5 backdrop-blur-2xl border border-white/10 w-full max-w-md rounded-[3rem] p-10 shadow-2xl text-center">
            <div class="mb-10">
                <div class="inline-flex p-6 rounded-3xl bg-indigo-600 mb-6">
                    <i data-lucide="shield-check" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-3xl font-black text-white italic uppercase">PV-2026 <span class="text-indigo-500">PRO</span></h1>
                <p class="text-slate-500 text-[10px] font-black uppercase tracking-[0.3em] mt-2 italic">Controle Escolar</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="loginUser" placeholder="USUÁRIO" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold uppercase">
                <input type="password" id="loginPass" placeholder="SENHA" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold">
                <button onclick="login()" class="w-full py-5 rounded-2xl bg-white text-black font-black uppercase text-xs tracking-widest hover:bg-indigo-50 transition-all">Acessar Painel</button>
            </div>
        </div>
    </div>

    <!-- Dashboard Principal -->
    <div id="mainDashboard" class="hidden p-6 md:p-10">
        <header class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center mb-10 gap-6">
            <nav class="flex gap-2 bg-black/40 backdrop-blur-xl p-2 rounded-[2.5rem] border border-white/10 shadow-2xl overflow-x-auto w-full lg:w-auto">
                <button onclick="navTo('aba-dash')" class="nav-btn active px-6 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Dashboard</button>
                <button onclick="navTo('aba-alunos')" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Matrícula</button>
                <button onclick="navTo('aba-atrasos')" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Portaria</button>
                <button onclick="navTo('aba-historico')" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Histórico</button>
                <button id="btn-nav-usuarios" onclick="navTo('aba-usuarios')" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase text-amber-400 whitespace-nowrap">Usuários</button>
                <button id="btn-nav-dados" onclick="navTo('aba-gestao-dados')" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase text-emerald-400 whitespace-nowrap">Dados</button>
            </nav>
            <div class="flex items-center gap-4">
                <div id="userBadge" class="bg-white/10 px-4 py-2 rounded-full border border-white/10 text-[9px] font-black uppercase text-indigo-400 italic"></div>
                <button onclick="logout()" class="p-4 bg-white/5 border border-white/10 text-red-500 rounded-2xl hover:bg-red-500/10 transition-all"><i data-lucide="power"></i></button>
            </div>
        </header>

        <main class="max-w-[1600px] mx-auto">
            <!-- DASHBOARD -->
            <section id="aba-dash" class="tab-content animate-3d-entry">
                <div class="grid lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-indigo-600 p-8 rounded-[3rem] shadow-2xl">
                        <p class="text-[10px] font-black text-indigo-200 uppercase mb-2">Total Alunos</p>
                        <h2 id="statTotalAlunos" class="text-5xl font-black text-white italic">0</h2>
                    </div>
                    <div class="bg-white/5 p-8 rounded-[3rem] border border-white/10">
                        <p class="text-[10px] font-black text-slate-500 uppercase mb-2">Entradas Registradas</p>
                        <h2 id="statTotalAtrasos" class="text-5xl font-black text-white italic">0</h2>
                    </div>
                    <div class="lg:col-span-2 bg-white/5 p-8 rounded-[3rem] border border-white/10 flex items-center justify-center min-h-[150px]">
                        <canvas id="graficoAtrasos"></canvas>
                    </div>
                </div>
            </section>

            <!-- MATRÍCULA -->
            <section id="aba-alunos" class="tab-content hidden animate-3d-entry">
                <div id="container-matricula" class="bg-white/5 p-10 rounded-[3rem] border border-white/10">
                    <h2 class="text-xl font-black mb-6 uppercase italic text-white">Nova Matrícula</h2>
                    <div class="flex flex-wrap gap-4">
                        <input type="text" id="alunoNome" placeholder="NOME COMPLETO" class="bg-black/40 p-4 rounded-xl border border-white/10 flex-1 uppercase font-bold text-xs outline-none focus:border-indigo-500">
                        <select id="alunoSerie" class="bg-black/40 p-4 rounded-xl border border-white/10 text-xs font-bold outline-none text-slate-300">
                            <option value="" disabled selected>SÉRIE</option>
                            <option value="6">6º ANO</option><option value="7">7º ANO</option>
                            <option value="8">8º ANO</option><option value="9">9º ANO</option>
                            <option value="1">1º ANO</option><option value="2">2º ANO</option>
                            <option value="3">3º ANO</option>
                        </select>
                        <select id="alunoTurma" class="bg-black/40 p-4 rounded-xl border border-white/10 text-xs font-bold outline-none text-slate-300">
                            <option value="" disabled selected>TURMA</option>
                            <option value="A">A</option><option value="B">B</option>
                            <option value="C">C</option><option value="D">D</option>
                            <option value="E">E</option><option value="F">F</option>
                            <option value="G">G</option>
                        </select>
                        <button id="btn-salvar-aluno" onclick="adicionarAluno()" class="bg-indigo-600 px-8 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-indigo-500 transition-all">Salvar</button>
                    </div>
                </div>
            </section>

            <!-- USUÁRIOS -->
            <section id="aba-usuarios" class="tab-content hidden animate-3d-entry">
                <div class="bg-white/5 p-10 rounded-[3rem] border border-white/10 mb-8">
                    <h2 class="text-xl font-black mb-6 uppercase italic text-white">Criar Novo Operador</h2>
                    <div class="flex flex-wrap gap-4 items-end">
                        <input type="text" id="newUserName" placeholder="NOME DO USUÁRIO" class="flex-1 bg-black/40 p-4 rounded-xl border border-white/10 uppercase font-bold text-xs outline-none focus:border-indigo-500">
                        <input type="password" id="newUserPass" placeholder="SENHA" class="flex-1 bg-black/40 p-4 rounded-xl border border-white/10 font-bold text-xs outline-none focus:border-indigo-500">
                        
                        <div class="bg-black/40 p-4 rounded-xl border border-white/10">
                            <span class="text-[9px] font-black uppercase text-slate-500 italic block mb-2">Cargo:</span>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="roleSelect" value="MASTER"> <span class="text-[9px] text-amber-500 uppercase font-black">Master</span></label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="roleSelect" value="SIMPLES" checked> <span class="text-[9px] text-indigo-500 uppercase font-black">Operador</span></label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="roleSelect" value="SECRETARIA"> <span class="text-[9px] text-emerald-500 uppercase font-black">Leitura</span></label>
                            </div>
                        </div>

                        <button onclick="criarUsuario()" class="bg-amber-500 h-[52px] px-8 rounded-xl font-black text-black uppercase text-[10px] tracking-widest hover:bg-amber-400 transition-all">Criar Acesso</button>
                    </div>
                </div>
                <div class="bg-black/20 border border-white/10 rounded-[3rem] overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-500">
                            <tr><th class="p-6">Usuário Ativo</th><th class="p-6">Hierarquia</th><th class="p-6 text-right">Ação</th></tr>
                        </thead>
                        <tbody id="listaUsuarios" class="text-xs font-bold"></tbody>
                    </table>
                </div>
            </section>

            <!-- PORTARIA -->
            <section id="aba-atrasos" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-2 gap-12">
                    <div class="space-y-6">
                        <div class="p-10 rounded-[3.5rem] bg-white/5 border border-white/10 text-center">
                            <p id="horaAtual" class="text-7xl font-black text-white italic tabular-nums">00:00:00</p>
                        </div>
                        <input type="text" id="searchAluno" oninput="buscarAluno()" placeholder="BUSCAR ALUNO..." class="w-full p-8 rounded-[2.5rem] bg-white/5 border border-white/10 outline-none text-lg font-bold uppercase focus:border-indigo-500">
                        <div id="resultadoBusca" class="bg-slate-900 rounded-3xl border border-white/10 hidden max-h-60 overflow-y-auto shadow-2xl"></div>
                    </div>
                    <div id="formAtrasoContainer" class="hidden">
                        <div class="bg-white/5 p-12 rounded-[4rem] border border-white/10 shadow-2xl">
                            <h3 id="nomeAlunoSelecionado" class="text-3xl font-black uppercase text-white mb-2 italic"></h3>
                            <p id="infoAlunoSelecionado" class="text-[10px] text-indigo-400 font-black uppercase mb-8"></p>
                            <div id="opcoes-portaria">
                                <div class="grid gap-3 mb-8">
                                    <label class="radio-ent"><input type="radio" name="motivo" value="Transporte"><span>Transporte</span></label>
                                    <label class="radio-ent"><input type="radio" name="motivo" value="Pessoal"><span>Pessoal</span></label>
                                    <label class="radio-ent"><input type="radio" name="motivo" value="Outros"><span>Outros</span></label>
                                </div>
                                <button id="btn-validar-entrada" onclick="salvarAtraso()" class="w-full py-6 rounded-3xl bg-white text-black font-black uppercase text-[10px] tracking-widest hover:bg-indigo-50 transition-all">Validar Entrada</button>
                            </div>
                            <div id="msg-readonly-portaria" class="hidden text-center p-6 border border-white/10 rounded-3xl bg-white/5">
                                <p class="text-amber-500 font-black uppercase text-[10px]">Acesso apenas para consulta</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- HISTÓRICO -->
            <section id="aba-historico" class="tab-content hidden animate-3d-entry">
                <div class="bg-black/20 border border-white/10 rounded-[3.5rem] overflow-hidden">
                    <div class="p-8 bg-white/5 border-b border-white/5 flex flex-col md:flex-row justify-between items-center gap-4">
                        <span class="text-xl font-black uppercase italic text-white">Registros de Portaria</span>
                        <div class="flex gap-4 w-full md:w-auto">
                            <input type="text" id="searchHist" oninput="filtrarHistorico()" placeholder="Filtrar por nome..." class="bg-black/40 p-3 rounded-xl border border-white/10 text-xs outline-none focus:border-indigo-500 flex-1">
                            <button onclick="exportarPDF()" class="bg-red-600 px-6 py-2 rounded-xl text-[9px] font-black hover:bg-red-500 transition-all">PDF</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-500">
                                <tr><th class="p-6">Data</th><th class="p-6">Estudante</th><th class="p-6">Turma</th><th class="p-6">Motivo</th></tr>
                            </thead>
                            <tbody id="corpoHistorico" class="text-sm font-bold text-slate-300"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- GESTÃO DE DADOS -->
            <section id="aba-gestao-dados" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-2 gap-8">
                    <div class="bg-black/20 border border-white/10 rounded-[3rem] overflow-hidden">
                        <div class="p-6 bg-white/5 border-b border-white/5 text-white font-black uppercase italic">Remover Alunos</div>
                        <div class="max-h-[500px] overflow-y-auto">
                            <table class="w-full text-left">
                                <tbody id="listaGestaoAlunos" class="text-xs font-bold"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="bg-black/20 border border-white/10 rounded-[3rem] overflow-hidden">
                        <div class="p-6 bg-white/5 border-b border-white/5 text-white font-black uppercase italic">Limpar Histórico</div>
                        <div class="max-h-[500px] overflow-y-auto">
                            <table class="w-full text-left">
                                <tbody id="listaGestaoHistorico" class="text-xs font-bold"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // CORREÇÃO CRÍTICA: Garantindo que o ADMIN inicial tenha o cargo MASTER
        let usuarios = JSON.parse(localStorage.getItem('pv_users')) || [{u: 'ADMIN', p: '2026', role: 'MASTER'}];
        
        // Garante que se o ADMIN existir mas não tiver role, ele receba MASTER
        let adminIndex = usuarios.findIndex(user => user.u === 'ADMIN');
        if(adminIndex !== -1 && !usuarios[adminIndex].role) {
            usuarios[adminIndex].role = 'MASTER';
            localStorage.setItem('pv_users', JSON.stringify(usuarios));
        }

        let alunos = JSON.parse(localStorage.getItem('pv_alunos')) || [];
        let historico = JSON.parse(localStorage.getItem('pv_historico')) || [];
        let currentUser = null;
        let alunoSelecionado = null;
        let acaoConfirmacao = null;
        let chartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const savedSession = localStorage.getItem('pv_session_data');
            if(savedSession) {
                currentUser = JSON.parse(savedSession);
                startApp();
            }
            setInterval(() => {
                const el = document.getElementById('horaAtual');
                if(el) el.innerText = new Date().toLocaleTimeString('pt-BR');
            }, 1000);
        });

        function login() {
            const u = document.getElementById('loginUser').value.toUpperCase().trim();
            const p = document.getElementById('loginPass').value;
            const userValid = usuarios.find(user => user.u === u && user.p === p);
            
            if(userValid) {
                currentUser = userValid;
                localStorage.setItem('pv_session_data', JSON.stringify(userValid));
                startApp();
                showToast(`Bem-vindo, ${u}!`, 'success');
            } else {
                showToast('Acesso negado!', 'error');
            }
        }

        function startApp() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('userBadge').innerText = `${currentUser.u} | ${currentUser.role}`;
            
            if(currentUser.role === 'SIMPLES') {
                document.getElementById('btn-nav-usuarios').classList.add('hidden');
                document.getElementById('btn-nav-dados').classList.add('hidden');
            }
            if(currentUser.role === 'SECRETARIA') {
                document.getElementById('btn-nav-usuarios').classList.add('hidden');
                document.getElementById('btn-nav-dados').classList.add('hidden');
                document.getElementById('btn-salvar-aluno').classList.add('hidden');
                document.getElementById('opcoes-portaria').classList.add('hidden');
                document.getElementById('msg-readonly-portaria').classList.remove('hidden');
            }
            atualizarStats();
        }

        function logout() {
            localStorage.removeItem('pv_session_data');
            location.reload();
        }

        function navTo(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            event.currentTarget.classList.add('active');
            if(tabId === 'aba-gestao-dados') renderizarGestao();
            if(tabId === 'aba-usuarios') renderizarUsuarios();
        }

        function adicionarAluno() {
            if(currentUser.role === 'SECRETARIA') return;
            const nome = document.getElementById('alunoNome').value.toUpperCase();
            const serie = document.getElementById('alunoSerie').value;
            const turma = document.getElementById('alunoTurma').value;
            if(!nome || !serie || !turma) return showToast('Preencha tudo!', 'error');
            alunos.push({ id: Date.now(), nome, turma: `${serie}º ${turma}` });
            localStorage.setItem('pv_alunos', JSON.stringify(alunos));
            document.getElementById('alunoNome').value = '';
            atualizarStats();
            showToast('Estudante matriculado!');
        }

        function criarUsuario() {
            if(currentUser.role !== 'MASTER') {
                showToast('Apenas Master pode criar usuários!', 'error');
                return;
            }
            const u = document.getElementById('newUserName').value.toUpperCase().trim();
            const p = document.getElementById('newUserPass').value.trim();
            const roleInput = document.querySelector('input[name="roleSelect"]:checked');
            if(!u || !p || !roleInput) return showToast('Preencha tudo e selecione um cargo!', 'error');
            const role = roleInput.value;
            if(usuarios.some(user => user.u === u)) return showToast('Usuário já existe!', 'error');
            usuarios.push({ u, p, role });
            localStorage.setItem('pv_users', JSON.stringify(usuarios));
            document.getElementById('newUserName').value = '';
            document.getElementById('newUserPass').value = '';
            renderizarUsuarios();
            showToast('Usuário criado com sucesso!');
        }

        function renderizarUsuarios() {
            const lista = document.getElementById('listaUsuarios');
            lista.innerHTML = usuarios.map((user, i) => `
                <tr class="border-b border-white/5">
                    <td class="p-6 text-white uppercase">${user.u}</td>
                    <td class="p-6">
                        <span class="px-3 py-1 rounded text-[8px] font-black uppercase ${user.role === 'MASTER' ? 'bg-amber-500/20 text-amber-500' : user.role === 'SECRETARIA' ? 'bg-emerald-500/20 text-emerald-500' : 'bg-indigo-500/20 text-indigo-500'}">
                            ${user.role}
                        </span>
                    </td>
                    <td class="p-6 text-right">
                        ${user.u !== 'ADMIN' ? `<button onclick="removerUsuario(${i})" class="text-red-500 font-black text-[9px]">REMOVER</button>` : '-'}
                    </td>
                </tr>`).join('');
        }

        function removerUsuario(idx) {
            openModal('Remover Acesso', `Deseja excluir o usuário ${usuarios[idx].u}?`, () => {
                usuarios.splice(idx, 1);
                localStorage.setItem('pv_users', JSON.stringify(usuarios));
                renderizarUsuarios();
                showToast('Usuário removido');
            });
        }

        function buscarAluno() {
            const termo = document.getElementById('searchAluno').value.toUpperCase();
            const res = document.getElementById('resultadoBusca');
            res.innerHTML = '';
            if(termo.length < 2) return res.classList.add('hidden');
            const filtrados = alunos.filter(a => a.nome.includes(termo));
            filtrados.forEach(a => {
                const d = document.createElement('div');
                d.className = 'p-4 hover:bg-indigo-600 cursor-pointer border-b border-white/5 font-bold text-xs';
                d.innerText = `${a.nome} (${a.turma})`;
                d.onclick = () => {
                    alunoSelecionado = a;
                    res.classList.add('hidden');
                    document.getElementById('formAtrasoContainer').classList.remove('hidden');
                    document.getElementById('nomeAlunoSelecionado').innerText = a.nome;
                    document.getElementById('infoAlunoSelecionado').innerText = `TURMA: ${a.turma}`;
                };
                res.appendChild(d);
            });
            res.classList.remove('hidden');
        }

        function salvarAtraso() {
            if(currentUser.role === 'SECRETARIA') return;
            const mot = document.querySelector('input[name="motivo"]:checked')?.value;
            if(!mot) return showToast('Selecione o motivo!', 'info');
            historico.unshift({ data: new Date().toLocaleString('pt-BR'), nome: alunoSelecionado.nome, turma: alunoSelecionado.turma, motivo: mot });
            localStorage.setItem('pv_historico', JSON.stringify(historico));
            document.getElementById('formAtrasoContainer').classList.add('hidden');
            document.getElementById('searchAluno').value = '';
            atualizarStats();
            showToast('Entrada registrada!');
        }

        function atualizarStats() {
            const statTotalAlunos = document.getElementById('statTotalAlunos');
            const statTotalAtrasos = document.getElementById('statTotalAtrasos');
            if (statTotalAlunos) statTotalAlunos.innerText = alunos.length;
            if (statTotalAtrasos) statTotalAtrasos.innerText = historico.length;
            renderTableHistorico(historico);
            initChart();
        }

        function initChart() {
            const canvas = document.getElementById('graficoAtrasos');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const counts = historico.reduce((acc, curr) => { acc[curr.motivo] = (acc[curr.motivo] || 0) + 1; return acc; }, {});
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(counts),
                    datasets: [{ data: Object.values(counts), backgroundColor: ['#6366f1', '#10b981', '#f59e0b'], borderWidth: 0 }]
                },
                options: { plugins: { legend: { labels: { color: '#94a3b8', font: { weight: 'bold', size: 10 } } } } }
            });
        }

        function filtrarHistorico() {
            const busca = document.getElementById('searchHist').value.toUpperCase();
            const filtrados = historico.filter(h => h.nome.includes(busca));
            renderTableHistorico(filtrados);
        }

        function renderTableHistorico(dados) {
            const corpo = document.getElementById('corpoHistorico');
            if (!corpo) return;
            corpo.innerHTML = dados.map(h => `
                <tr class="border-b border-white/5">
                    <td class="p-6 text-indigo-400 text-xs">${h.data}</td>
                    <td class="p-6 uppercase">${h.nome}</td>
                    <td class="p-6">${h.turma}</td>
                    <td class="p-6 uppercase"><span class="bg-white/5 px-3 py-1 rounded-full text-[10px]">${h.motivo}</span></td>
                </tr>`).join('');
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("RELATÓRIO DE PORTARIA - PV-2026", 14, 15);
            const rows = historico.map(h => [h.data, h.nome, h.turma, h.motivo]);
            doc.autoTable({ head: [['Data', 'Aluno', 'Turma', 'Motivo']], body: rows, startY: 25 });
            doc.save('relatorio_portaria.pdf');
        }

        function renderizarGestao() {
            const listaAlunos = document.getElementById('listaGestaoAlunos');
            const listaHist = document.getElementById('listaGestaoHistorico');
            if (listaAlunos) {
                listaAlunos.innerHTML = alunos.map((a, i) => `
                    <tr class="border-b border-white/5">
                        <td class="p-4">${a.nome}</td>
                        <td class="p-4 text-right">
                            ${currentUser.role !== 'SECRETARIA' ? `<button onclick="excluir('alunos', ${i})" class="text-red-500 font-black text-[9px]">EXCLUIR</button>` : '-'}
                        </td>
                    </tr>`).join('');
            }
            if (listaHist) {
                listaHist.innerHTML = historico.map((h, i) => `
                    <tr class="border-b border-white/5">
                        <td class="p-4">${h.nome} (${h.data})</td>
                        <td class="p-4 text-right">
                            ${currentUser.role !== 'SECRETARIA' ? `<button onclick="excluir('historico', ${i})" class="text-red-500 font-black text-[9px]">REMOVER</button>` : '-'}
                        </td>
                    </tr>`).join('');
            }
        }

        function excluir(tipo, idx) {
            if(currentUser.role === 'SECRETARIA') return;
            openModal('Atenção', 'Deseja remover este registro permanentemente?', () => {
                if(tipo === 'alunos') alunos.splice(idx, 1);
                else historico.splice(idx, 1);
                localStorage.setItem(`pv_${tipo}`, JSON.stringify(tipo === 'alunos' ? alunos : historico));
                renderizarGestao();
                atualizarStats();
            });
        }

        function showToast(msg, tipo = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-card toast-${tipo}`;
            toast.innerHTML = `<span class="text-[11px] font-black uppercase text-white">${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        function openModal(t, txt, cb) {
            document.getElementById('modalTitle').innerText = t;
            document.getElementById('modalText').innerText = txt;
            document.getElementById('customModal').classList.remove('hidden');
            document.getElementById('customModal').classList.add('flex');
            acaoConfirmacao = cb;
        }

        function closeModal() { document.getElementById('customModal').classList.add('hidden'); }
        document.getElementById('modalConfirmBtn').onclick = () => { acaoConfirmacao(); closeModal(); };
    </script>
</body>
</html>
