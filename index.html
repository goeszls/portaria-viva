<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV-2026 | Gestão Escolar Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">

    <div id="toastContainer" class="fixed top-5 right-5 z-[100] flex flex-col gap-3"></div>

    <div id="authSection" class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
        <div class="bg-white w-full max-w-md rounded-[3rem] shadow-2xl p-10">
            <div class="text-center mb-8">
                <div class="inline-flex p-4 rounded-3xl bg-indigo-50 text-indigo-600 mb-4">
                    <i data-lucide="graduation-cap" class="w-10 h-10"></i>
                </div>
                <h1 class="text-2xl font-black uppercase tracking-tighter">PV-2026 Gestão</h1>
                <div class="flex justify-center gap-4 mt-4">
                    <button onclick="toggleAuth(true)" id="btnShowLogin" class="text-sm font-bold border-b-2 border-indigo-600 pb-1">LOGIN</button>
                    <button onclick="toggleAuth(false)" id="btnShowReg" class="text-sm font-bold text-slate-400 pb-1">REGISTRO</button>
                </div>
            </div>

            <form id="loginForm" class="space-y-4">
                <input type="text" id="loginUser" placeholder="Usuário" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 ring-indigo-500">
                <input type="password" id="loginPass" placeholder="Senha" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 ring-indigo-500">
                <button type="submit" class="w-full py-4 rounded-2xl bg-indigo-600 text-white font-black uppercase tracking-widest hover:bg-indigo-700 transition-all">Acessar</button>
            </form>

            <form id="registerForm" class="space-y-4 hidden">
                <input type="text" id="regUser" placeholder="Novo Usuário" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none">
                <input type="password" id="regPass" placeholder="Senha" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none">
                <button type="submit" class="w-full py-4 rounded-2xl bg-slate-800 text-white font-black uppercase tracking-widest hover:bg-black transition-all">Criar Conta</button>
            </form>
        </div>
    </div>

    <div id="mainDashboard" class="hidden min-h-screen p-4 md:p-8">
        <header class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <nav class="flex gap-2 bg-white p-2 rounded-3xl shadow-sm">
                <button onclick="navTo('aba-alunos')" class="nav-btn active px-6 py-3 rounded-2xl font-bold text-xs uppercase transition-all">Alunos</button>
                <button onclick="navTo('aba-atrasos')" class="nav-btn px-6 py-3 rounded-2xl font-bold text-xs uppercase transition-all">Registrar Atraso</button>
                <button onclick="navTo('aba-historico')" class="nav-btn px-6 py-3 rounded-2xl font-bold text-xs uppercase transition-all">Histórico</button>
                <button id="navAdmin" onclick="navTo('aba-admin')" class="hidden nav-btn px-6 py-3 rounded-2xl font-bold text-xs uppercase bg-red-50 text-red-600">Admin</button>
            </nav>
            <button onclick="logout()" class="p-4 rounded-2xl bg-white text-red-500 shadow-sm hover:bg-red-50 transition-all"><i data-lucide="log-out"></i></button>
        </header>

        <main class="max-w-7xl mx-auto bg-white rounded-[3rem] shadow-xl p-8 min-h-[70vh]">
            
            <section id="aba-alunos" class="tab-content">
                <div class="grid md:grid-cols-3 gap-8">
                    <div class="md:col-span-1 space-y-6">
                        <h2 class="text-xl font-black uppercase tracking-tighter italic">Matrícula</h2>
                        <form id="formAluno" class="space-y-3">
                            <input type="text" id="alunoNome" placeholder="Nome do Aluno" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none" required>
                            
                            <select id="alunoSerie" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none font-bold text-xs" required>
                                <option value="" disabled selected>SELECIONE A SÉRIE</option>
                                <optgroup label="TÉCNICO">
                                    <option value="1 TEC">1 TEC</option><option value="2 TEC">2 TEC</option><option value="3 TEC">3 TEC</option>
                                </optgroup>
                                <optgroup label="ENSINO MÉDIO">
                                    <option value="1 ANO">1 ANO</option><option value="2 ANO">2 ANO</option><option value="3 ANO">3 ANO</option>
                                </optgroup>
                                <optgroup label="ENSINO FUNDAMENTAL">
                                    <option value="6 ANO">6 ANO</option><option value="7 ANO">7 ANO</option><option value="8 ANO">8 ANO</option><option value="9 ANO">9 ANO</option>
                                </optgroup>
                            </select>

                            <select id="alunoTurma" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none font-bold text-xs" required>
                                <option value="" disabled selected>SELECIONE A TURMA</option>
                                <option value="SISTEMAS">SISTEMAS</option><option value="AUTOMAÇÃO">AUTOMAÇÃO</option>
                                <option value="A">A</option><option value="B">B</option><option value="C">C</option>
                                <option value="D">D</option><option value="E">E</option><option value="F">F</option><option value="G">G</option>
                            </select>

                            <select id="alunoPeriodo" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none font-bold text-xs" required>
                                <option value="Manhã">MANHÃ</option><option value="Tarde">TARDE</option>
                            </select>

                            <button type="submit" class="w-full py-4 rounded-2xl bg-indigo-600 text-white font-black uppercase text-xs">Confirmar Matrícula</button>
                        </form>
                    </div>
                    <div class="md:col-span-2 overflow-hidden rounded-3xl border border-slate-100">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[10px] uppercase font-black text-slate-400">
                                <tr><th class="p-4">Aluno</th><th class="p-4">Série/Turma</th><th class="p-4">Período</th><th class="p-4 text-right">Ação</th></tr>
                            </thead>
                            <tbody id="listaAlunos" class="text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="aba-atrasos" class="tab-content hidden">
                <div id="lockAtraso" class="text-center py-20 hidden">
                    <i data-lucide="lock" class="w-12 h-12 mx-auto text-slate-300 mb-4"></i>
                    <p class="text-slate-400 font-bold uppercase text-xs">Acesso Restrito ao Administrador</p>
                </div>
                <div id="contentAtraso" class="grid md:grid-cols-2 gap-12">
                    <div class="space-y-6">
                        <div class="border-b pb-4">
                            <p id="dataAtual" class="text-xs font-black text-indigo-500 uppercase"></p>
                            <h2 id="horaAtual" class="text-5xl font-black text-slate-800 tabular-nums">00:00:00</h2>
                        </div>
                        <div class="relative">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Pesquisar para Registro</label>
                            <input type="text" id="searchAluno" oninput="filtrarAlunosAtraso()" placeholder="Nome do aluno..." class="w-full p-5 rounded-3xl bg-slate-100 border-none outline-none focus:ring-2 ring-indigo-500">
                            <div id="resultadoBusca" class="absolute top-full left-0 right-0 bg-white shadow-2xl rounded-3xl mt-2 z-50 overflow-hidden hidden border border-slate-100"></div>
                        </div>
                    </div>
                    <div id="formAtrasoContainer" class="hidden">
                        <div class="bg-slate-50 p-8 rounded-[2.5rem] border border-slate-200">
                            <h3 id="nomeAlunoSelecionado" class="text-lg font-black uppercase mb-6 text-indigo-600"></h3>
                            <div class="space-y-4">
                                <div class="grid grid-cols-1 gap-2">
                                    <label class="checkbox-card"><input type="radio" name="motivo" value="Circular"> <span>Atraso de Circular</span></label>
                                    <label class="checkbox-card"><input type="radio" name="motivo" value="Médico"> <span>Consulta Médica</span></label>
                                    <label class="checkbox-card"><input type="radio" name="motivo" value="Pessoal"> <span>Assuntos Pessoais</span></label>
                                    <label class="checkbox-card"><input type="radio" name="motivo" value="Outros"> <span>Outros (Justificar)</span></label>
                                </div>
                                <textarea id="justificativa" placeholder="Justificativa livre..." class="w-full p-4 rounded-2xl border-none bg-white shadow-inner hidden h-24 outline-none"></textarea>
                                <button onclick="salvarAtraso()" class="w-full py-5 rounded-2xl bg-slate-900 text-white font-black uppercase">Validar Atraso</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="aba-historico" class="tab-content hidden">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-black uppercase italic">Histórico de Entradas</h2>
                    <button onclick="exportarPDF()" class="px-6 py-3 rounded-2xl bg-green-600 text-white font-bold text-xs uppercase">Gerar PDF</button>
                </div>
                <div class="overflow-x-auto rounded-[2rem] border border-slate-100">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-900 text-white text-[10px] uppercase">
                            <tr><th class="p-4">Data</th><th class="p-4">Hora</th><th class="p-4">Aluno</th><th class="p-4">Min. Atraso</th><th class="p-4">Motivo</th></tr>
                        </thead>
                        <tbody id="tabelaHistorico" class="text-sm"></tbody>
                    </table>
                </div>
            </section>

            <section id="aba-admin" class="tab-content hidden">
                <h2 class="text-2xl font-black uppercase text-red-600 mb-8 tracking-tighter italic">Gestão de Gestores</h2>
                <div class="overflow-hidden rounded-[2rem] border border-slate-100 max-w-2xl">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] uppercase text-slate-400">
                            <tr><th class="p-4">Usuário</th><th class="p-4 text-right">Ação</th></tr>
                        </thead>
                        <tbody id="listaGestores"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
