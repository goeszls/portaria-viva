<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV-2026 PRO | Controle Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen font-sans">

    <div id="authSection" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white/5 backdrop-blur-2xl border border-white/10 w-full max-w-md rounded-[3rem] p-10 shadow-2xl text-center">
            <div class="mb-10">
                <div class="inline-flex p-6 rounded-3xl bg-indigo-600 mb-6">
                    <i data-lucide="shield-check" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-3xl font-black text-white italic uppercase">PV-2026 <span class="text-indigo-500">PRO</span></h1>
                <p class="text-slate-500 text-[10px] font-black uppercase tracking-[0.3em] mt-2 italic">Controle Escolar</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="loginUser" placeholder="USUÁRIO" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold uppercase">
                <input type="password" id="loginPass" placeholder="SENHA" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold">
                <button onclick="login()" class="w-full py-5 rounded-2xl bg-white text-black font-black uppercase text-xs tracking-widest hover:bg-indigo-50 transition-all">Acessar Painel</button>
            </div>
        </div>
    </div>

    <div id="mainDashboard" class="hidden p-6 md:p-10">
        <header class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center mb-10 gap-6">
            <nav class="flex gap-2 bg-black/40 backdrop-blur-xl p-2 rounded-[2.5rem] border border-white/10 shadow-2xl overflow-x-auto">
                <button onclick="navTo('aba-dash')" class="nav-btn active px-6 py-4 rounded-2xl font-black text-[10px] uppercase">Dashboard</button>
                <button onclick="navTo('aba-alunos')" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase">Matrícula</button>
                <button onclick="navTo('aba-atrasos')" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase">Portaria</button>
                <button onclick="navTo('aba-historico')" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase">Histórico</button>
                <button onclick="navTo('aba-gestor')" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase text-indigo-400">Gestor</button>
            </nav>
            <button onclick="location.reload()" class="p-4 bg-white/5 border border-white/10 text-red-500 rounded-2xl hover:bg-red-500/10 transition-colors"><i data-lucide="power"></i></button>
        </header>

        <main class="max-w-[1600px] mx-auto">
            <section id="aba-dash" class="tab-content animate-3d-entry">
                <div class="grid lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-indigo-600 p-8 rounded-[3rem] shadow-2xl">
                        <p class="text-[10px] font-black text-indigo-200 uppercase mb-2">Total Alunos</p>
                        <h2 id="statTotalAlunos" class="text-5xl font-black text-white italic">0</h2>
                    </div>
                    <div class="lg:col-span-3 bg-white/5 border border-white/10 rounded-[3.5rem] p-8 flex justify-between items-center">
                        <div>
                            <h3 class="text-xl font-black uppercase italic text-white">Relatório Geral</h3>
                            <p class="text-slate-500 text-xs">Gere o PDF com as métricas atuais do sistema.</p>
                        </div>
                        <button onclick="exportarPDF('dashboard')" class="bg-indigo-600 px-8 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-indigo-500">Exportar Dashboard</button>
                    </div>
                </div>
            </section>

            <section id="aba-alunos" class="tab-content hidden animate-3d-entry">
                <div class="bg-white/5 p-10 rounded-[3rem] border border-white/10">
                    <h2 class="text-xl font-black mb-6 uppercase italic text-white">Cadastro de Estudante</h2>
                    <div class="flex flex-wrap gap-4">
                        <input type="text" id="alunoNome" placeholder="NOME COMPLETO" class="bg-black/40 p-4 rounded-xl border border-white/10 flex-1 uppercase outline-none focus:border-indigo-500 font-bold text-xs">
                        
                        <select id="alunoSerie" class="bg-black/40 p-4 rounded-xl border border-white/10 outline-none focus:border-indigo-500 text-slate-300 font-bold text-xs">
                            <option value="" disabled selected>SÉRIE</option>
                            <optgroup label="Ensino Fundamental">
                                <option value="6">6º ANO</option><option value="7">7º ANO</option>
                                <option value="8">8º ANO</option><option value="9">9º ANO</option>
                            </optgroup>
                            <optgroup label="Ensino Médio">
                                <option value="1">1º ANO</option><option value="2">2º ANO</option>
                                <option value="3">3º ANO</option>
                            </optgroup>
                            <optgroup label="Técnico">
                                <option value="1º TEC">1º TEC</option><option value="2º TEC">2º TEC</option>
                                <option value="3º TEC">3º TEC</option>
                            </optgroup>
                        </select>

                        <select id="alunoTurma" class="bg-black/40 p-4 rounded-xl border border-white/10 outline-none focus:border-indigo-500 text-slate-300 font-bold text-xs">
                            <option value="" disabled selected>TURMA</option>
                            <option value="A">A</option><option value="B">B</option><option value="C">C</option>
                            <option value="D">D</option><option value="E">E</option><option value="F">F</option><option value="G">G</option>
                        </select>

                        <button onclick="adicionarAluno()" class="bg-indigo-600 px-8 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-indigo-500">Salvar</button>
                    </div>
                </div>
            </section>

            <section id="aba-atrasos" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-2 gap-12">
                    <div class="space-y-6">
                        <div class="p-10 rounded-[3.5rem] bg-white/5 border border-white/10 text-center">
                            <p id="horaAtual" class="text-7xl font-black text-white italic tabular-nums">00:00:00</p>
                        </div>
                        <input type="text" id="searchAluno" oninput="buscarAluno()" placeholder="BUSCAR ALUNO..." class="w-full p-8 rounded-[2.5rem] bg-white/5 border border-white/10 outline-none text-lg font-bold uppercase focus:border-indigo-500">
                        <div id="resultadoBusca" class="bg-slate-900 rounded-3xl border border-white/10 hidden max-h-60 overflow-y-auto"></div>
                    </div>
                    <div id="formAtrasoContainer" class="hidden">
                        <div class="bg-white/5 p-12 rounded-[4rem] border border-white/10 shadow-2xl">
                            <h3 id="nomeAlunoSelecionado" class="text-3xl font-black uppercase text-white mb-2 italic"></h3>
                            <p id="infoAlunoSelecionado" class="text-[10px] text-indigo-400 font-black uppercase mb-8"></p>
                            <div class="grid gap-3 mb-8">
                                <label class="radio-ent"><input type="radio" name="motivo" value="Transporte"><span>Transporte</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Pessoal"><span>Pessoal</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Outros"><span>Outros</span></label>
                            </div>
                            <button onclick="salvarAtraso()" class="w-full py-6 rounded-3xl bg-white text-black font-black uppercase text-[10px] tracking-widest hover:bg-indigo-50">Validar Entrada</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="aba-historico" class="tab-content hidden animate-3d-entry">
                <div class="bg-black/20 border border-white/10 rounded-[3.5rem] overflow-hidden">
                    <div class="p-8 flex justify-between items-center bg-white/5 border-b border-white/5">
                        <h2 class="text-xl font-black uppercase italic text-white">Registros de Portaria</h2>
                        <button onclick="exportarPDF('historico')" class="bg-red-600 px-6 py-3 rounded-xl font-black text-[9px] uppercase hover:bg-red-500">Exportar PDF</button>
                    </div>
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-500">
                            <tr><th class="p-6">Data/Hora</th><th class="p-6">Estudante</th><th class="p-6">Turma</th><th class="p-6">Motivo</th></tr>
                        </thead>
                        <tbody id="corpoHistorico" class="text-sm font-bold text-slate-300"></tbody>
                    </table>
                </div>
            </section>

            <section id="aba-gestor" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-3 gap-8">
                    <div class="bg-white/5 p-8 rounded-[3rem] border border-white/10">
                        <h2 class="text-lg font-black mb-6 uppercase italic text-white">Novo Funcionário</h2>
                        <div class="space-y-4">
                            <input type="text" id="newStaffUser" placeholder="USUÁRIO" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 uppercase font-bold text-xs outline-none focus:border-indigo-500">
                            <input type="password" id="newStaffPass" placeholder="SENHA" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 font-bold text-xs outline-none focus:border-indigo-500">
                            <select id="newStaffRole" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 font-bold text-xs text-slate-400 outline-none">
                                <option value="PORTARIA">PORTARIA</option>
                                <option value="SECRETARIA">SECRETARIA</option>
                                <option value="GESTOR">GESTOR / ADMIN</option>
                            </select>
                            <button onclick="criarFuncionario()" class="w-full bg-white text-black py-4 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-indigo-50 transition-all">Cadastrar Acesso</button>
                        </div>
                    </div>
                    <div class="lg:col-span-2 bg-black/20 border border-white/10 rounded-[3rem] overflow-hidden">
                        <div class="p-6 bg-white/5 border-b border-white/5 text-white font-black uppercase italic">Equipe Cadastrada</div>
                        <table class="w-full text-left">
                            <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-500">
                                <tr><th class="p-4">Usuário</th><th class="p-4">Cargo</th><th class="p-4 text-right">Ações</th></tr>
                            </thead>
                            <tbody id="corpoGestor" class="text-xs font-bold text-slate-300"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
