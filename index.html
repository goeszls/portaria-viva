<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV-2026 PRO | Controle Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen font-sans">

    <div id="authSection" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white/5 backdrop-blur-2xl border border-white/10 w-full max-w-md rounded-[3rem] p-10 shadow-2xl animate-3d-entry text-center">
            <div class="mb-10">
                <div class="inline-flex p-6 rounded-3xl bg-indigo-600 shadow-indigo-500/20 mb-6">
                    <i data-lucide="shield-check" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-3xl font-black text-white italic uppercase">PV-2026 <span class="text-indigo-500">PRO</span></h1>
                <p class="text-slate-500 text-[10px] font-black uppercase tracking-[0.3em] mt-2 italic">Controle Escolar</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <input type="text" id="loginUser" placeholder="USUÁRIO" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold transition-all">
                <input type="password" id="loginPass" placeholder="SENHA" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold transition-all">
                <button type="submit" class="w-full py-5 rounded-2xl bg-white text-black font-black uppercase text-xs tracking-widest hover:bg-indigo-50 transition-all">Acessar Painel</button>
            </form>
        </div>
    </div>

    <div id="mainDashboard" class="hidden p-6 md:p-10">
        <header class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center mb-10 gap-6">
            <nav class="flex gap-2 bg-black/40 backdrop-blur-xl p-2 rounded-[2.5rem] border border-white/10 shadow-2xl overflow-x-auto max-w-full">
                <button onclick="navTo('aba-dash', event)" class="nav-btn active px-6 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Dashboard</button>
                <button onclick="navTo('aba-alunos', event)" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Matrícula</button>
                <button onclick="navTo('aba-atrasos', event)" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Portaria</button>
                <button onclick="navTo('aba-historico', event)" class="nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Histórico</button>
                <button id="navAdmin" onclick="navTo('aba-admin', event)" class="hidden nav-btn px-6 py-4 rounded-2xl font-black text-[10px] uppercase text-red-400 whitespace-nowrap">Master</button>
            </nav>
            <div class="flex items-center gap-4 bg-white/5 p-3 rounded-3xl border border-white/10">
                <div class="text-right pr-4 border-r border-white/10">
                    <p id="userStatus" class="text-[10px] font-black text-indigo-400 uppercase"></p>
                    <p class="text-[8px] text-green-500 font-bold uppercase tracking-tighter">● Sistema Ativo</p>
                </div>
                <button onclick="logout()" class="p-4 text-red-500 hover:bg-red-500/10 rounded-2xl transition-all"><i data-lucide="power"></i></button>
            </div>
        </header>

        <main class="max-w-[1600px] mx-auto">
            
            <section id="aba-dash" class="tab-content animate-3d-entry">
                <div class="grid lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-indigo-600 p-8 rounded-[3rem] shadow-2xl relative overflow-hidden">
                        <p class="text-[10px] font-black text-indigo-200 uppercase mb-2">Total de Alunos</p>
                        <h2 id="statTotalAlunos" class="text-5xl font-black text-white italic">0</h2>
                    </div>
                    <div class="bg-red-600 p-8 rounded-[3rem] shadow-2xl relative overflow-hidden">
                        <p class="text-[10px] font-black text-red-200 uppercase mb-2">Turma com mais Atrasos</p>
                        <h2 id="statTurmaProblema" class="text-2xl font-black text-white italic uppercase">---</h2>
                    </div>
                    <div class="lg:col-span-2 bg-white/5 border border-white/10 rounded-[3.5rem] p-8">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-[10px] font-black uppercase text-slate-500">Métricas de Frequência</h3>
                            <button onclick="exportarPDF()" class="flex items-center gap-2 px-6 py-3 rounded-2xl bg-white/5 hover:bg-white/10 text-[9px] font-black uppercase transition-all">
                                <i data-lucide="download" class="w-4 h-4"></i> PDF
                            </button>
                        </div>
                        <div class="grid md:grid-cols-2 gap-8">
                            <canvas id="chartAtrasos" height="150"></canvas>
                            <div id="riscoContainer" class="space-y-2 overflow-y-auto max-h-[140px]"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="aba-alunos" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-12 gap-8">
                    <div class="lg:col-span-4 bg-white/5 border border-white/10 p-10 rounded-[3.5rem]">
                        <h2 class="text-xl font-black uppercase italic mb-8">Novo Cadastro</h2>
                        <form id="formAluno" class="space-y-4">
                            <input type="text" id="alunoNome" placeholder="NOME COMPLETO" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-xs font-bold uppercase outline-none focus:border-indigo-500">
                            
                            <div class="grid grid-cols-2 gap-3">
                                <select id="alunoSerie" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-[10px] font-black uppercase outline-none">
                                    <optgroup label="Ensino Fundamental" class="bg-slate-900">
                                        <option value="6 ANO">6º ANO</option><option value="7 ANO">7º ANO</option>
                                        <option value="8 ANO">8º ANO</option><option value="9 ANO">9º ANO</option>
                                    </optgroup>
                                    <optgroup label="Ensino Médio" class="bg-slate-900">
                                        <option value="1 ANO">1º ANO</option><option value="2 ANO">2º ANO</option><option value="3 ANO">3º ANO</option>
                                    </optgroup>
                                    <optgroup label="Técnico" class="bg-slate-900">
                                        <option value="1 TEC">1º TEC</option><option value="2 TEC">2º TEC</option><option value="3 TEC">3º TEC</option>
                                    </optgroup>
                                </select>
                                <select id="alunoTurma" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-[10px] font-black uppercase outline-none">
                                    <option value="SISTEMAS">SISTEMAS</option><option value="AUTOMAÇÃO">AUTOMAÇÃO</option>
                                    <option value="A">TURMA A</option><option value="B">TURMA B</option><option value="C">TURMA C</option>
                                    <option value="D">TURMA D</option><option value="E">TURMA E</option><option value="F">TURMA F</option><option value="G">TURMA G</option>
                                </select>
                            </div>

                            <select id="alunoPeriodo" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-[10px] font-black uppercase outline-none">
                                <option value="Manhã">MANHÃ (07:05)</option><option value="Tarde">TARDE (13:05)</option>
                            </select>

                            <button type="submit" class="w-full py-5 rounded-2xl bg-indigo-600 text-white font-black uppercase text-[10px] tracking-widest shadow-xl transition-all hover:bg-indigo-500">Salvar Dados</button>
                        </form>
                    </div>
                    <div class="lg:col-span-8 bg-black/20 border border-white/10 rounded-[3.5rem] overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-500">
                                <tr><th class="p-6">Nome</th><th class="p-6">Série/Turma</th><th class="p-6">Turno</th><th class="p-6 text-right">Controle</th></tr>
                            </thead>
                            <tbody id="listaAlunos" class="text-sm font-bold text-slate-300"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="aba-atrasos" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-2 gap-12">
                    <div class="space-y-6">
                        <div class="p-10 rounded-[3.5rem] bg-white/5 border border-white/10 text-center">
                            <p id="horaAtual" class="text-7xl font-black text-white italic tracking-tighter tabular-nums">00:00:00</p>
                        </div>
                        <div class="relative">
                            <input type="text" id="searchAluno" oninput="filtrarAlunosAtraso()" placeholder="BUSCAR ALUNO PELO NOME..." class="w-full p-8 rounded-[2.5rem] bg-white/5 border border-white/10 outline-none text-lg font-bold uppercase focus:border-indigo-500">
                            <div id="resultadoBusca" class="absolute z-50 w-full mt-2 bg-[#0f172a] rounded-3xl overflow-hidden hidden border border-white/10 shadow-2xl"></div>
                        </div>
                    </div>
                    <div id="formAtrasoContainer" class="hidden">
                        <div class="bg-white/5 p-12 rounded-[4rem] border border-white/10 shadow-2xl relative">
                            <div id="statusAlerta" class="hidden absolute top-8 right-8 px-4 py-2 bg-red-600 text-white text-[8px] font-black uppercase rounded-full animate-pulse">Atraso Recorrente</div>
                            <h3 id="nomeAlunoSelecionado" class="text-3xl font-black uppercase text-white mb-2 italic"></h3>
                            <p id="infoAlunoSelecionado" class="text-[10px] text-indigo-400 font-black uppercase mb-8"></p>
                            <div class="grid gap-3 mb-8">
                                <label class="radio-ent"><input type="radio" name="motivo" value="Transporte"><span>Transporte</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Pessoal"><span>Pessoal</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Saúde"><span>Saúde</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Outros"><span>Outros</span></label>
                            </div>
                            <button onclick="salvarAtraso()" class="w-full py-6 rounded-3xl bg-white text-black font-black uppercase text-[10px] tracking-widest hover:bg-indigo-50 transition-all">Validar Entrada</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="aba-historico" class="tab-content hidden animate-3d-entry">
                <div class="bg-black/20 border border-white/10 rounded-[3.5rem] overflow-hidden">
                    <div class="p-8 border-b border-white/5 flex justify-between items-center bg-white/5">
                        <h2 class="text-xl font-black uppercase italic">Registros Escolares</h2>
                        <input type="text" id="filtroHistorico" oninput="renderizarHistorico()" placeholder="Filtrar por nome..." class="p-3 bg-black/40 border border-white/10 rounded-xl text-xs outline-none focus:border-indigo-500">
                    </div>
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-500">
                            <tr><th class="p-6">Data/Hora</th><th class="p-6">Estudante</th><th class="p-6">Turma</th><th class="p-6">Motivo</th><th class="p-6 text-right">Ação</th></tr>
                        </thead>
                        <tbody id="corpoHistorico" class="text-sm font-bold text-slate-300"></tbody>
                    </table>
                </div>
            </section>

            <section id="aba-admin" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-2 gap-10">
                    <div class="bg-white/5 border border-white/10 p-10 rounded-[3.5rem]">
                        <h2 class="text-xl font-black uppercase text-red-500 mb-8 italic">Gestão de Operadores</h2>
                        <form id="formNovoGestor" class="space-y-4 mb-10">
                            <input type="text" id="newUserName" placeholder="NOME DO OPERADOR" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 outline-none font-bold text-xs uppercase">
                            <input type="password" id="newUserPass" placeholder="SENHA" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 outline-none font-bold text-xs">
                            <button type="submit" class="w-full py-5 rounded-2xl bg-red-600 text-white font-black uppercase text-[10px] tracking-widest">Ativar Staff</button>
                        </form>
                        <div class="rounded-3xl border border-white/5 overflow-hidden">
                            <table class="w-full text-left">
                                <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-500">
                                    <tr><th class="p-6">Usuário</th><th class="p-6 text-right">Status</th></tr>
                                </thead>
                                <tbody id="listaGestores"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
