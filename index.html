<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA PV-2026 | Enterprise Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex items-center justify-center p-4">
    
    <div id="toastContainer" class="fixed top-5 right-5 z-[100] flex flex-col gap-3"></div>

    <div id="telaLogin" class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center">
        <div class="mb-6 inline-flex p-4 rounded-full bg-slate-100 text-slate-800">
            <i data-lucide="shield-check" class="w-10 h-10"></i>
        </div>
        <h1 class="text-2xl font-black mb-2 uppercase tracking-tighter">PV-2026 Login</h1>
        <p class="text-slate-500 text-sm mb-8">Acesse o painel administrativo</p>

        <form id="loginForm" class="space-y-4">
            <input type="text" id="loginUser" placeholder="Usuário" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 ring-slate-800" required>
            <input type="password" id="loginPass" placeholder="Senha" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 ring-slate-800" required>
            <button type="submit" class="w-full py-4 rounded-2xl bg-slate-900 text-white font-bold uppercase tracking-widest hover:bg-black transition-colors">Entrar</button>
        </form>
    </div>

    <div id="app" class="hidden w-full max-w-5xl bg-white p-6 md:p-8 rounded-[2.5rem] shadow-2xl">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <nav class="flex bg-slate-100 p-1 rounded-2xl w-full md:w-auto">
                <button onclick="switchTab('tab-funcionarios')" class="tab-btn active-tab px-6 py-2 rounded-xl text-xs font-bold uppercase transition-all">Funcionários</button>
                <button onclick="switchTab('tab-registro')" class="tab-btn px-6 py-2 rounded-xl text-xs font-bold uppercase transition-all">Registrar Ponto</button>
                <button onclick="switchTab('tab-historico')" class="tab-btn px-6 py-2 rounded-xl text-xs font-bold uppercase transition-all">Histórico</button>
            </nav>
            <div class="flex items-center gap-4">
                <span id="userStatus" class="text-[10px] font-black text-slate-400 uppercase"></span>
                <button onclick="logout()" class="p-3 rounded-xl bg-red-50 text-red-600 hover:bg-red-100"><i data-lucide="log-out"></i></button>
            </div>
        </div>

        <div id="tab-funcionarios" class="tab-content grid md:grid-cols-2 gap-8">
            <div class="space-y-4">
                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Novo Cadastro</h3>
                <form id="registerForm" class="space-y-3">
                    <input type="text" id="regUser" placeholder="Nome de Usuário" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-100 outline-none">
                    <input type="password" id="regPass" placeholder="Senha" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-100 outline-none">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="regRole" class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs font-bold">
                            <option value="user">Comum</option>
                            <option value="admin">Admin</option>
                        </select>
                        <input type="time" id="regTime" value="08:00" class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs font-bold">
                    </div>
                    <button type="submit" class="w-full py-3 rounded-xl bg-slate-800 text-white font-bold text-xs uppercase hover:bg-slate-700">Cadastrar</button>
                </form>
            </div>
            <div class="space-y-4">
                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Lista de Acessos</h3>
                <div class="overflow-hidden rounded-2xl border border-slate-100">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] uppercase text-slate-400">
                            <tr><th class="p-3">User</th><th class="p-3">Entrada</th><th class="p-3">Ação</th></tr>
                        </thead>
                        <tbody id="userList" class="text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-registro" class="tab-content hidden py-10 text-center">
            <h3 class="text-xl font-black uppercase mb-2">Painel de Presença</h3>
            <div id="relogio" class="text-5xl font-mono font-bold mb-8 text-slate-800">00:00:00</div>
            <button onclick="baterPonto()" class="max-w-xs w-full py-6 rounded-[2rem] bg-indigo-600 text-white font-black text-lg shadow-xl shadow-indigo-100 hover:scale-[1.02] active:scale-95 transition-all">
                REGISTRAR ENTRADA
            </button>
        </div>

        <div id="tab-historico" class="tab-content hidden">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Logs de Presença</h3>
                <button onclick="gerarPDF()" class="bg-green-600 text-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase hover:bg-green-700">Baixar Relatório</button>
            </div>
            <div class="overflow-hidden rounded-2xl border border-slate-100">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-[10px] uppercase text-slate-400">
                        <tr><th class="p-3">Funcionário</th><th class="p-3">Data/Hora</th><th class="p-3">Status</th></tr>
                    </thead>
                    <tbody id="historyList" class="text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
