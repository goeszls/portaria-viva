<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV-2026 PRO | SEED-PR Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen font-sans">

    <div id="authSection" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white/5 backdrop-blur-2xl border border-white/10 w-full max-w-md rounded-[3rem] p-10 shadow-2xl text-center">
            <div class="mb-10">
                <div class="inline-flex p-6 rounded-3xl bg-indigo-600 shadow-indigo-500/20 mb-6">
                    <i data-lucide="shield-check" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-3xl font-black text-white italic uppercase tracking-tighter">PV-2026 <span class="text-indigo-500">PRO</span></h1>
                <p class="text-slate-500 text-[10px] font-black uppercase tracking-[0.3em] mt-2 italic">Controle Escolar SEED-PR</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <input type="text" id="loginUser" placeholder="USUÁRIO" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold transition-all">
                <input type="password" id="loginPass" placeholder="SENHA" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold transition-all">
                <button type="submit" class="w-full py-5 rounded-2xl bg-white text-black font-black uppercase text-xs tracking-widest hover:bg-indigo-50 transition-all">Acessar Painel</button>
            </form>
        </div>
    </div>

    <div id="mainDashboard" class="hidden p-6 md:p-10">
        <header class="max-w-[1400px] mx-auto flex flex-col lg:flex-row justify-between items-center mb-8 gap-6">
            <nav class="flex gap-2 bg-black/40 p-2 rounded-[2.5rem] border border-white/10 shadow-2xl overflow-x-auto max-w-full">
                <button onclick="navTo('aba-atrasos', event)" class="nav-btn active px-8 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Portaria (RA)</button>
                <button onclick="navTo('aba-dash', event)" class="nav-btn px-8 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Dashboard</button>
                <button onclick="navTo('aba-historico', event)" class="nav-btn px-8 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Histórico</button>
                <button id="navAdmin" onclick="navTo('aba-admin', event)" class="hidden nav-btn px-8 py-4 rounded-2xl font-black text-[10px] uppercase text-red-400 whitespace-nowrap">Administração</button>
            </nav>
            <div class="flex items-center gap-4">
                <div class="text-right hidden md:block">
                    <p id="userDisplay" class="text-[10px] font-black text-indigo-400 uppercase"></p>
                    <p class="text-[8px] text-green-500 font-bold uppercase tracking-widest">Sistema Ativo</p>
                </div>
                <button onclick="logout()" class="p-4 text-red-500 hover:bg-red-500/10 rounded-2xl transition-all"><i data-lucide="log-out"></i></button>
            </div>
        </header>

        <main class="max-w-[1400px] mx-auto">
            
            <section id="aba-atrasos" class="tab-content animate-3d-entry">
                <div class="grid lg:grid-cols-2 gap-12 items-start">
                    <div class="space-y-6">
                        <div class="p-10 rounded-[3.5rem] bg-white/5 border border-white/10 text-center shadow-2xl">
                            <p id="horaAtual" class="text-8xl font-black text-white italic tracking-tighter tabular-nums">00:00</p>
                        </div>
                        <div class="relative">
                            <input type="text" id="searchAluno" oninput="filtrarAlunosAtraso()" placeholder="BUSCAR POR NOME OU RA..." class="w-full p-8 rounded-[2.5rem] bg-indigo-600/10 border border-indigo-500/30 outline-none text-xl font-bold uppercase focus:border-indigo-500 shadow-2xl placeholder:text-indigo-300/30">
                            <div id="resultadoBusca" class="absolute z-50 w-full mt-2 bg-[#0f172a] rounded-3xl overflow-hidden hidden border border-white/10 shadow-2xl"></div>
                        </div>
                    </div>

                    <div id="formAtrasoContainer" class="hidden">
                        <div class="bg-white/5 p-10 rounded-[4rem] border border-white/10 relative shadow-2xl">
                            <div id="statusAlerta" class="hidden absolute -top-4 left-1/2 -translate-x-1/2 px-6 py-2 bg-red-600 text-white text-[10px] font-black uppercase rounded-full shadow-xl animate-bounce">Atraso Recorrente!</div>
                            <h3 id="nomeAlunoSelecionado" class="text-3xl font-black uppercase text-indigo-400 mb-2 italic"></h3>
                            <p id="infoAlunoSelecionado" class="text-[10px] text-slate-500 font-black uppercase mb-8 tracking-widest"></p>
                            
                            <div class="grid grid-cols-2 gap-3 mb-8">
                                <label class="radio-ent"><input type="radio" name="motivo" value="Transporte"><span>Transporte</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Pessoal"><span>Pessoal</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Saúde"><span>Saúde</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Outros"><span>Outros</span></label>
                            </div>
                            <button onclick="salvarAtraso()" class="w-full py-6 rounded-3xl bg-white text-black font-black uppercase text-[10px] tracking-widest hover:scale-[1.02] active:scale-95 transition-all">Registrar Entrada</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="aba-dash" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-4 gap-6">
                    <div class="bg-white/5 border border-white/10 p-8 rounded-[3rem]">
                        <p class="text-[10px] font-black text-slate-500 uppercase mb-2">Total Matriculados</p>
                        <h2 id="statTotalAlunos" class="text-5xl font-black text-white italic">0</h2>
                    </div>
                    <div class="bg-red-600/20 border border-red-500/30 p-8 rounded-[3rem]">
                        <p class="text-[10px] font-black text-red-400 uppercase mb-2">Pico de Atrasos (Turma)</p>
                        <h2 id="statTurmaProblema" class="text-2xl font-black text-white uppercase truncate">---</h2>
                    </div>
                    <div class="lg:col-span-2 bg-white/5 border border-white/10 rounded-[3rem] p-8">
                        <p class="text-[10px] font-black text-slate-500 uppercase mb-4 text-center">Frequência Semanal (Seg-Sex)</p>
                        <canvas id="chartAtrasos" height="100"></canvas>
                    </div>
                    <div class="lg:col-span-4 bg-white/5 border border-white/10 rounded-[3rem] p-8">
                        <p class="text-[10px] font-black text-red-500 uppercase mb-6 flex items-center gap-2"><i data-lucide="alert-circle" class="w-3 h-3"></i> Alunos com 3 ou mais atrasos</p>
                        <div id="riscoContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
                    </div>
                </div>
            </section>

            <section id="aba-historico" class="tab-content hidden animate-3d-entry">
                <div class="bg-black/20 border border-white/10 rounded-[3rem] overflow-hidden shadow-2xl">
                    <div class="p-8 border-b border-white/5 flex justify-between items-center bg-white/5">
                        <h2 class="text-xl font-black uppercase italic">Registros Recentes</h2>
                        <input type="text" id="filtroHistorico" oninput="renderizarHistorico()" placeholder="Filtrar por nome..." class="p-3 bg-black/40 border border-white/10 rounded-xl text-xs outline-none focus:border-indigo-500">
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-500">
                                <tr><th class="p-6">Hora</th><th class="p-6">RA</th><th class="p-6">Aluno</th><th class="p-6">Turma</th><th class="p-6">Motivo</th><th class="p-6 text-right">Ação</th></tr>
                            </thead>
                            <tbody id="corpoHistorico" class="text-sm font-bold text-slate-300"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="aba-admin" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-12 gap-10">
                    <div class="lg:col-span-4 space-y-6">
                        <div class="bg-white/5 border border-white/10 p-8 rounded-[3.5rem] shadow-xl">
                            <h2 class="text-sm font-black uppercase text-indigo-400 mb-8 italic">Nova Matrícula SEED</h2>
                            <form id="formAluno" class="space-y-4">
                                <input type="text" id="alunoRA" placeholder="Nº RA OFICIAL" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-xs font-bold uppercase outline-none focus:border-indigo-500 transition-all">
                                <input type="text" id="alunoNome" placeholder="NOME COMPLETO" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-xs font-bold uppercase outline-none focus:border-indigo-500 transition-all">
                                <div class="grid grid-cols-2 gap-3">
                                    <select id="alunoSerie" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-[10px] font-black uppercase outline-none">
                                        <optgroup label="Fundamental" class="bg-slate-900 text-indigo-400">
                                            <option value="6 ANO">6º ANO</option><option value="7 ANO">7º ANO</option><option value="8 ANO">8º ANO</option><option value="9 ANO">9º ANO</option>
                                        </optgroup>
                                        <optgroup label="Médio/Técnico" class="bg-slate-900 text-indigo-400">
                                            <option value="1 ANO">1º ANO</option><option value="2 ANO">2º ANO</option><option value="3 ANO">3º ANO</option>
                                        </optgroup>
                                    </select>
                                    <select id="alunoTurma" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-[10px] font-black uppercase outline-none">
                                        <option value="SISTEMAS">SISTEMAS</option><option value="AUTOMAÇÃO">AUTOMAÇÃO</option>
                                        <option value="A">TURMA A</option><option value="B">TURMA B</option><option value="C">TURMA C</option><option value="D">TURMA D</option>
                                    </select>
                                </div>
                                <button type="submit" class="w-full py-5 rounded-2xl bg-indigo-600 text-white font-black uppercase text-[10px] tracking-widest shadow-xl hover:bg-indigo-500 transition-all">Confirmar Matrícula</button>
                            </form>
                        </div>
                        <button onclick="gerarRelatorioImpressao()" class="w-full py-8 rounded-[2.5rem] bg-white text-black font-black uppercase text-[11px] flex items-center justify-center gap-4 hover:bg-indigo-50 transition-all shadow-2xl">
                            <i data-lucide="printer" class="w-5 h-5"></i> Gerar Relatório A4
                        </button>
                    </div>
                    
                    <div class="lg:col-span-8 bg-black/20 border border-white/10 rounded-[3.5rem] overflow-hidden shadow-2xl">
                        <div class="p-8 border-b border-white/5 font-black text-xs uppercase text-slate-500 tracking-widest">Alunos Ativos no Sistema</div>
                        <div class="max-h-[600px] overflow-y-auto">
                            <table class="w-full text-left">
                                <tbody id="listaAlunos" class="text-xs font-bold text-slate-300"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
