<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV-2026 PRO | Gestão de Funcionários</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen font-sans">

    <div id="authSection" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white/5 backdrop-blur-2xl border border-white/10 w-full max-w-md rounded-[3rem] p-10 shadow-2xl text-center">
            <div class="mb-10">
                <div class="inline-flex p-6 rounded-3xl bg-indigo-600 shadow-indigo-500/20 mb-6">
                    <i data-lucide="users" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-3xl font-black text-white italic uppercase tracking-tighter">STAFF <span class="text-indigo-500">CONTROL</span></h1>
                <p class="text-slate-500 text-[10px] font-black uppercase tracking-[0.3em] mt-2 italic">Gestão Corporativa</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <input type="text" id="loginUser" placeholder="USUÁRIO" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold transition-all">
                <input type="password" id="loginPass" placeholder="SENHA" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold transition-all">
                <button type="submit" class="w-full py-5 rounded-2xl bg-white text-black font-black uppercase text-xs tracking-widest hover:bg-indigo-50 transition-all">Acessar Sistema</button>
            </form>
        </div>
    </div>

    <div id="mainDashboard" class="hidden p-6 md:p-10">
        <header class="max-w-[1400px] mx-auto flex flex-col lg:flex-row justify-between items-center mb-8 gap-6">
            <nav class="flex gap-2 bg-black/40 p-2 rounded-[2.5rem] border border-white/10 shadow-2xl overflow-x-auto">
                <button onclick="navTo('aba-operacao', event)" class="nav-btn active px-8 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Registro de Entrada</button>
                <button onclick="navTo('aba-dash', event)" class="nav-btn px-8 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Indicadores</button>
                <button onclick="navTo('aba-historico', event)" class="nav-btn px-8 py-4 rounded-2xl font-black text-[10px] uppercase whitespace-nowrap">Logs de Acesso</button>
                <button id="navAdmin" onclick="navTo('aba-admin', event)" class="hidden nav-btn px-8 py-4 rounded-2xl font-black text-[10px] uppercase text-red-400 whitespace-nowrap">Gestão de RH</button>
            </nav>
            <button onclick="logout()" class="p-4 text-red-500 hover:bg-red-500/10 rounded-2xl transition-all"><i data-lucide="log-out"></i></button>
        </header>

        <main class="max-w-[1400px] mx-auto">
            
            <section id="aba-operacao" class="tab-content animate-3d-entry">
                <div class="grid lg:grid-cols-2 gap-12">
                    <div class="space-y-6">
                        <div class="p-10 rounded-[3.5rem] bg-white/5 border border-white/10 text-center">
                            <p id="horaAtual" class="text-8xl font-black text-white italic tracking-tighter tabular-nums">00:00</p>
                        </div>
                        <div class="relative">
                            <input type="text" id="searchStaff" oninput="filtrarFuncionarios()" placeholder="PESQUISAR FUNCIONÁRIO..." class="w-full p-8 rounded-[2.5rem] bg-indigo-600/10 border border-indigo-500/30 outline-none text-xl font-bold uppercase focus:border-indigo-500 shadow-2xl">
                            <div id="resultadoBusca" class="absolute z-50 w-full mt-2 bg-[#0f172a] rounded-3xl overflow-hidden hidden border border-white/10 shadow-2xl"></div>
                        </div>
                    </div>

                    <div id="formRegistroContainer" class="hidden">
                        <div class="bg-white/5 p-10 rounded-[4rem] border border-white/10 relative shadow-2xl">
                            <h3 id="nomeStaffSelecionado" class="text-3xl font-black uppercase text-indigo-400 mb-2 italic"></h3>
                            <p id="infoStaffSelecionado" class="text-[10px] text-slate-500 font-black uppercase mb-8 tracking-widest"></p>
                            
                            <div class="grid grid-cols-2 gap-3 mb-8">
                                <label class="radio-ent"><input type="radio" name="motivo" value="Atraso"><span>Atraso</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Extra"><span>Hora Extra</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Saída Antecipada"><span>Saída Ant.</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Normal"><span>Normal</span></label>
                            </div>
                            <button onclick="salvarRegistro()" class="w-full py-6 rounded-3xl bg-white text-black font-black uppercase text-[10px] tracking-widest hover:scale-[1.02] transition-all">Confirmar Registro</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="aba-dash" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-4 gap-6">
                    <div class="bg-white/5 border border-white/10 p-8 rounded-[3rem]">
                        <p class="text-[10px] font-black text-slate-500 uppercase mb-2">Total de Staff</p>
                        <h2 id="statTotalStaff" class="text-5xl font-black text-white italic">0</h2>
                    </div>
                    <div class="bg-white/5 border border-white/10 p-8 rounded-[3rem]">
                        <p class="text-[10px] font-black text-slate-500 uppercase mb-2">Setor Mais Ativo</p>
                        <h2 id="statSetorAtivo" class="text-2xl font-black text-indigo-400 uppercase truncate">---</h2>
                    </div>
                    <div class="lg:col-span-2 bg-white/5 border border-white/10 rounded-[3rem] p-8">
                        <canvas id="chartFluxo" height="100"></canvas>
                    </div>
                </div>
            </section>

            <section id="aba-admin" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-12 gap-10">
                    <div class="lg:col-span-4 space-y-6">
                        <div class="bg-white/5 border border-white/10 p-8 rounded-[3.5rem]">
                            <h2 class="text-sm font-black uppercase text-indigo-400 mb-8 italic">Cadastrar Funcionário</h2>
                            <form id="formStaff" class="space-y-4">
                                <input type="text" id="staffNome" placeholder="NOME COMPLETO" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-xs font-bold uppercase outline-none focus:border-indigo-500">
                                <div class="grid grid-cols-2 gap-3">
                                    <select id="staffSetor" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-[10px] font-black uppercase outline-none">
                                        <option value="ADMINISTRATIVO">ADMIN</option>
                                        <option value="OPERACIONAL">OPERACIONAL</option>
                                        <option value="LOGÍSTICA">LOGÍSTICA</option>
                                        <option value="VENDAS">VENDAS</option>
                                    </select>
                                    <input type="text" id="staffCargo" placeholder="CARGO" class="w-full p-5 rounded-2xl bg-black/40 border border-white/10 text-[10px] font-black uppercase outline-none">
                                </div>
                                <button type="submit" class="w-full py-5 rounded-2xl bg-indigo-600 text-white font-black uppercase text-[10px] tracking-widest shadow-xl">Salvar Colaborador</button>
                            </form>
                        </div>
                        <button onclick="imprimirRelatorioRH()" class="w-full py-8 rounded-[2.5rem] bg-white text-black font-black uppercase text-[11px] flex items-center justify-center gap-4 shadow-2xl">
                            <i data-lucide="file-text"></i> Relatório de Frequência
                        </button>
                    </div>
                    
                    <div class="lg:col-span-8 bg-black/20 border border-white/10 rounded-[3.5rem] overflow-hidden">
                        <div class="p-8 border-b border-white/5 font-black text-xs uppercase text-slate-500">Quadro de Funcionários</div>
                        <div class="max-h-[600px] overflow-y-auto">
                            <table class="w-full text-left">
                                <tbody id="listaStaff" class="text-xs font-bold text-slate-300"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
