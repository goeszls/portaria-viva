<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV-2026 | Enterprise School Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen font-sans perspective-container overflow-x-hidden">

    <div id="toastContainer" class="fixed top-6 right-6 z-[300] flex flex-col gap-4"></div>

    <div id="authSection" class="min-h-screen flex items-center justify-center p-6">
        <div class="auth-card bg-white/5 backdrop-blur-2xl border border-white/10 w-full max-w-md rounded-[3rem] p-10 animate-3d-entry shadow-2xl">
            <div class="text-center mb-10">
                <div class="inline-flex p-6 rounded-3xl bg-indigo-600 shadow-indigo-500/20 mb-6">
                    <i data-lucide="shield-check" class="w-10 h-10 text-white"></i>
                </div>
                <h1 class="text-3xl font-black text-white tracking-tighter italic italic">PV-2026 <span class="text-indigo-500">PRO</span></h1>
                <p class="text-slate-500 text-[9px] font-black uppercase tracking-[0.4em] mt-2">Restricted Enterprise Access</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Identificador</label>
                    <input type="text" id="loginUser" placeholder="Usuário" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold transition-all">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Chave de Acesso</label>
                    <input type="password" id="loginPass" placeholder="••••••••" class="w-full p-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 text-sm font-bold transition-all">
                </div>
                <button type="submit" class="w-full py-5 rounded-2xl bg-white text-black font-black uppercase text-xs tracking-widest hover:bg-indigo-50 transition-all">Autenticar</button>
            </form>
        </div>
    </div>

    <div id="mainDashboard" class="hidden p-6 md:p-10">
        <header class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center mb-10 gap-6 animate-3d-top">
            <nav class="flex gap-2 bg-black/40 backdrop-blur-xl p-2 rounded-[2.5rem] border border-white/10 shadow-2xl">
                <button onclick="navTo('aba-dash', event)" class="nav-btn active px-8 py-4 rounded-2xl font-black text-[10px] uppercase">Dashboard</button>
                <button onclick="navTo('aba-alunos', event)" class="nav-btn px-8 py-4 rounded-2xl font-black text-[10px] uppercase">Alunos</button>
                <button onclick="navTo('aba-atrasos', event)" class="nav-btn px-8 py-4 rounded-2xl font-black text-[10px] uppercase">Portaria</button>
                <button id="navAdmin" onclick="navTo('aba-admin', event)" class="hidden nav-btn px-8 py-4 rounded-2xl font-black text-[10px] uppercase text-red-400 border border-red-500/20">Gestão Master</button>
            </nav>
            <div class="flex items-center gap-4 bg-white/5 p-3 rounded-3xl border border-white/10">
                <div class="text-right pr-4 border-r border-white/10">
                    <p id="userStatus" class="text-[10px] font-black text-indigo-400 uppercase tracking-widest"></p>
                    <p class="text-[8px] text-slate-500 font-bold uppercase">Operação Online</p>
                </div>
                <button onclick="logout()" class="p-4 text-red-500 hover:bg-red-500/10 rounded-2xl transition-all"><i data-lucide="power"></i></button>
            </div>
        </header>

        <main class="max-w-[1600px] mx-auto">
            
            <section id="aba-dash" class="tab-content animate-3d-entry">
                <div class="grid lg:grid-cols-4 gap-6">
                    <div class="bg-indigo-600 p-10 rounded-[3.5rem] shadow-2xl shadow-indigo-500/20">
                        <i data-lucide="users" class="text-indigo-200 mb-4"></i>
                        <p class="text-[10px] font-black text-indigo-200 uppercase tracking-widest">Base de Alunos</p>
                        <h2 id="statTotalAlunos" class="text-6xl font-black text-white italic">0</h2>
                    </div>
                    <div class="lg:col-span-3 bg-white/5 border border-white/10 rounded-[4rem] p-10">
                        <h3 class="text-xl font-black uppercase italic mb-8 border-b border-white/5 pb-4">Alunos com Alerta de Recidiva</h3>
                        <div id="riscoContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </div>
                </div>
            </section>

            <section id="aba-alunos" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-12 gap-8">
                    <div class="lg:col-span-4 bg-white/5 border border-white/10 p-10 rounded-[3.5rem]">
                        <h2 class="text-xl font-black uppercase italic mb-8">Matrícula</h2>
                        <form id="formAluno" class="space-y-4">
                            <input type="text" id="alunoNome" placeholder="Nome Completo" class="w-full p-5 rounded-3xl bg-black/20 border border-white/10 text-sm font-bold uppercase outline-none focus:border-indigo-500">
                            <select id="alunoSerie" class="w-full p-5 rounded-3xl bg-black/20 border border-white/10 text-xs font-bold uppercase">
                                <option value="1 TEC">1 TEC</option><option value="2 TEC">2 TEC</option><option value="3 TEC">3 TEC</option>
                                <option value="1 ANO">1 ANO</option><option value="2 ANO">2 ANO</option><option value="3 ANO">3 ANO</option>
                                <option value="6 ANO">6 ANO</option><option value="7 ANO">7 ANO</option><option value="8 ANO">8 ANO</option><option value="9 ANO">9 ANO</option>
                            </select>
                            <select id="alunoTurma" class="w-full p-5 rounded-3xl bg-black/20 border border-white/10 text-xs font-bold uppercase">
                                <option value="SISTEMAS">SISTEMAS</option><option value="AUTOMAÇÃO">AUTOMAÇÃO</option>
                                <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
                            </select>
                            <select id="alunoPeriodo" class="w-full p-5 rounded-3xl bg-black/20 border border-white/10 text-xs font-bold uppercase">
                                <option value="Manhã">Manhã (7:05)</option><option value="Tarde">Tarde (13:05)</option>
                            </select>
                            <button type="submit" class="w-full py-5 rounded-3xl bg-indigo-600 text-white font-black uppercase text-[10px] tracking-widest shadow-xl shadow-indigo-500/20">Matricular</button>
                        </form>
                    </div>
                    <div class="lg:col-span-8 overflow-hidden border border-white/10 rounded-[3.5rem] bg-black/20">
                        <table class="w-full text-left">
                            <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-500">
                                <tr><th class="p-6">Nome</th><th class="p-6">Série</th><th class="p-6">Turno</th><th class="p-6 text-right">Ação</th></tr>
                            </thead>
                            <tbody id="listaAlunos" class="text-sm font-bold text-slate-300"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="aba-atrasos" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-2 gap-10">
                    <div class="space-y-6">
                        <div class="p-12 rounded-[4rem] bg-indigo-600/10 border border-indigo-500/20">
                            <p id="dataAtual" class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-2"></p>
                            <h2 id="horaAtual" class="text-7xl font-black text-white italic tracking-tighter">00:00:00</h2>
                        </div>
                        <input type="text" id="searchAluno" oninput="filtrarAlunosAtraso()" placeholder="Pesquisar para entrada..." class="w-full p-8 rounded-[2.5rem] bg-white/5 border border-white/10 outline-none text-lg font-bold">
                        <div id="resultadoBusca" class="bg-[#0f172a] shadow-2xl rounded-[2.5rem] overflow-hidden hidden border border-white/10"></div>
                    </div>
                    <div id="formAtrasoContainer" class="hidden">
                        <div class="bg-white/5 p-12 rounded-[4rem] border border-white/10 shadow-2xl">
                            <h3 id="nomeAlunoSelecionado" class="text-3xl font-black uppercase text-white mb-8 italic tracking-tighter"></h3>
                            <div class="grid gap-3 mb-8" id="motivosContainer">
                                <label class="radio-ent"><input type="radio" name="motivo" value="Circular"><span>Atraso de Circular</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Médico"><span>Atestado Médico</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Pessoal"><span>Motivos Pessoais</span></label>
                                <label class="radio-ent"><input type="radio" name="motivo" value="Outros"><span>Outros (Justificar)</span></label>
                            </div>
                            <textarea id="justificativa" placeholder="Descreva a situação..." class="w-full p-6 rounded-3xl bg-black/40 border border-white/10 text-white text-xs hidden h-32 outline-none mb-6"></textarea>
                            <button onclick="salvarAtraso()" class="w-full py-6 rounded-3xl bg-white text-black font-black uppercase text-[10px] tracking-widest shadow-xl">Registrar Ponto de Entrada</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="aba-admin" class="tab-content hidden animate-3d-entry">
                <div class="grid lg:grid-cols-2 gap-12">
                    <div class="bg-white/5 p-10 rounded-[3.5rem] border border-white/10">
                        <h2 class="text-xl font-black uppercase text-red-500 mb-8 italic italic">Criar Novo Gestor (Staff)</h2>
                        <form id="formNovoGestor" class="space-y-4">
                            <input type="text" id="newUserName" placeholder="Nome do Funcionário" class="w-full p-5 rounded-2xl bg-black/20 border border-white/10 outline-none font-bold">
                            <input type="password" id="newUserPass" placeholder="Definir Senha" class="w-full p-5 rounded-2xl bg-black/20 border border-white/10 outline-none font-bold">
                            <p class="text-[9px] text-slate-500 font-bold uppercase px-2">* Este usuário não terá permissões de admin.</p>
                            <button type="submit" class="w-full py-5 rounded-2xl bg-red-600 text-white font-black uppercase text-[10px] tracking-widest shadow-lg shadow-red-500/20">Criar Credencial Staff</button>
                        </form>
                    </div>
                    <div class="bg-white/5 p-10 rounded-[3.5rem] border border-white/10">
                        <h2 class="text-xl font-black uppercase text-slate-400 mb-8 italic">Gestores Ativos</h2>
                        <div class="overflow-hidden rounded-3xl border border-white/5">
                            <table class="w-full text-left">
                                <thead class="bg-white/5 text-[9px] uppercase font-black text-slate-500">
                                    <tr><th class="p-6">Login</th><th class="p-6 text-right">Revogar</th></tr>
                                </thead>
                                <tbody id="listaGestores"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
